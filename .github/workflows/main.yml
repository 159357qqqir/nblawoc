name: Build myshell
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装gcc
        run: sudo apt update && sudo apt install -y gcc

      - name: 编译 myshell.c
        run: gcc myshell.c -o myshell

      - name: 上传编译好的程序（可以下载）
        uses: actions/upload-artifact@v4
        with:
          name: myshell-bin
          path: ./myshell
