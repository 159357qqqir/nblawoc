name: Build myshell for Termux(aarch64)
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
      - name: compile
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang myshell.c -o myshell
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myshell-termux
          path: ./myshell
